<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>個股分析</title><style>
:root{--bg:#f5f3ff;--surface:#fff;--ink:#1f1b3a;--muted:#6b6790;--line:#e6e1fb;--accent:#7c5cff;--accent-soft:#efeaff;
--up:#f0294f;--up-soft:#ffe5ea;--down:#0fae6e;--down-soft:#dcf7ea;--warn:#b25e00;--warn-soft:#fff1dc;
--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--num:ui-monospace,Consolas,"Cascadia Mono",monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110f1f;--surface:#1c1930;--ink:#efedff;--muted:#a49fc7;
--line:#2c2850;--accent:#a996ff;--accent-soft:#2a2350;--up:#ff6b85;--up-soft:#3d1a2a;--down:#3ee09a;--down-soft:#123326;
--warn:#ffc46b;--warn-soft:#3a2c14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110f1f;--surface:#1c1930;--ink:#efedff;--muted:#a49fc7;--line:#2c2850;--accent:#a996ff;
--accent-soft:#2a2350;--up:#ff6b85;--up-soft:#3d1a2a;--down:#3ee09a;--down-soft:#123326;--warn:#ffc46b;--warn-soft:#3a2c14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding:20px 16px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
h1{font-size:1.6rem;margin:0;background:linear-gradient(135deg,#7c5cff,#ff5ca8);-webkit-background-clip:text;background-clip:text;color:transparent} h2{font-size:1.05rem;margin:0} h3{font-size:.95rem;margin:.6em 0 .2em}
.sub,.desc{color:var(--muted);font-size:.86rem;margin:0}
section{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 12px rgba(31,27,58,.06);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)} .kpi small{color:var(--muted);display:block;font-size:.78rem}
.kpi b{font-family:var(--num);font-size:1.25rem}
svg.spark{width:100%;height:56px;display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;background:none;border:none;border-bottom:3px solid transparent;padding:6px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:500;cursor:pointer;user-select:none}
th.l,td.l{text-align:left} td.num{font-family:var(--num)}
.chip{display:inline-block;font-size:.75rem;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--down-soft);color:var(--down);border-color:transparent}
.chip.obs{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.few{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.bad{background:var(--up-soft);color:var(--up);border-color:transparent}
details summary{cursor:pointer;color:var(--accent)}
.md{font-size:.92rem} .md table{width:auto} .md td,.md th{text-align:left;white-space:normal}
footer{color:var(--muted);font-size:.82rem;text-align:center}
a{color:var(--accent)}

.search{display:flex;gap:8px} .search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--ink)}
.search button{font:inherit;font-size:16px;border:none;border-radius:14px;padding:0 18px;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff5ca8)}
.hint{display:flex;flex-wrap:wrap;gap:6px} .hint a{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none}
#sug a{display:block;padding:8px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}</style><body><div class=wrap>
<header><div><h1>個股分析</h1><p class=sub>打代號或名稱｜資料到 2026-11-10 收盤（每天 16:50 更新）</p></div><a href="../index.html">回首頁</a></header>
<section><form class=search onsubmit="go(document.getElementById('q').value);return false"><input id=q placeholder="例如 2412 或 中華電" autocomplete=off inputmode=search>
<button>查</button></form><div id=sug></div><p class=desc>搜尋紀錄（存在這支手機，<a href="#" onclick="clearH();return false">清除</a>）</p><div class=hint id=hist></div></section><div id=out></div>
<footer>本系統僅為個人研究與模擬交易，非投資建議；過去績效不代表未來。絕不自動下單。</footer></div>
<script>
var L=[],H=null;try{H=JSON.parse(localStorage.getItem('hist')||'null')}catch(e){}if(!H)H=['1815'];
function saveH(c){H=[c].concat(H.filter(function(x){return x!=c})).slice(0,10);try{localStorage.setItem('hist',JSON.stringify(H))}catch(e){}drawH()}
function clearH(){H=[];try{localStorage.setItem('hist','[]')}catch(e){}drawH()}
function drawH(){var nm={};L.forEach(function(x){nm[x[0]]=x[1]});document.getElementById('hist').innerHTML=H.length?H.map(function(c){return '<a href="#'+c+'" onclick="go(this.dataset.c);return false" data-c="'+c+'">'+c+' '+esc(nm[c]||'')+'</a>'}).join(''):'<span class=desc>還沒有搜尋過</span>'}
fetch('data/list.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){L=j;drawH();if(location.hash.length>1)go(decodeURIComponent(location.hash.slice(1)));});
var q=document.getElementById('q'),sug=document.getElementById('sug'),out=document.getElementById('out');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function match(t){t=t.trim().toUpperCase();if(!t)return[];var a=L.filter(function(x){return x[0]==t});if(a.length)return a;
return L.filter(function(x){return x[0].indexOf(t)==0||x[1].toUpperCase().indexOf(t)>=0}).slice(0,8)}
q.oninput=function(){var m=match(q.value);sug.innerHTML=q.value.trim()&&!(m.length==1&&m[0][0]==q.value.trim().toUpperCase())?m.map(function(x){return '<a href="#'+x[0]+'" onclick="go(\''+x[0]+'\');return false">'+x[0]+' '+esc(x[1])+'</a>'}).join(''):''};
function go(t){var m=match(t);sug.innerHTML='';if(!m.length){out.innerHTML='<section><p class=desc>找不到「'+esc(t)+'」。可能代號打錯，或是成交量太少（20 日平均不到 100 張）沒有分析。</p></section>';return}
var c=m[0][0];q.value=c+' '+m[0][1];location.hash=c;saveH(c);out.innerHTML='<section><p class=desc>讀取中…</p></section>';
fetch('data/'+c+'.json?t='+Date.now()).then(function(r){return r.json()}).then(show).catch(function(){out.innerHTML='<section><p class=desc>讀不到資料，請稍後再試。</p></section>'})}
function show(a){var h='<section><h2>'+a.code+' '+esc(a.name)+'｜白話總結</h2><ul class=desc>'+a.notes.map(function(n){return '<li>'+n+'</li>'}).join('')+'</ul><p class=desc>資料到 '+a.date+' 收盤，'+a.made+' 產生。歷史資料整理，不是即時報價，也不是買賣建議。</p></section>';
a.sections.forEach(function(s){h+='<section><h2>'+s.h+'</h2>';if(s.k)h+='<div class=kpis>'+s.k.map(function(k){return '<div class=kpi><small>'+k[0]+'</small><b class="num '+k[2]+'">'+k[1]+'</b>'+(k[3]?'<small>'+k[3]+'</small>':'')+'</div>'}).join('')+'</div>';
if(s.p)h+='<p class=desc>'+s.p+'</p>';if(s.t)h+='<div class=tablebox><table><thead><tr>'+s.t.head.map(function(x){return '<th class=l>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+s.t.rows.map(function(r){return '<tr>'+r.map(function(x){return '<td class=l>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';h+='</section>'});
out.innerHTML=h;window.scrollTo(0,q.getBoundingClientRect().top+window.scrollY-10)}
window.onhashchange=function(){var c=decodeURIComponent(location.hash.slice(1));if(c&&q.value.indexOf(c)!=0)go(c)};
</script><script>(function(){
var mine=Date.parse(document.lastModified)||0;
function check(){fetch('index.html?t='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(r){
var lm=Date.parse(r.headers.get('Last-Modified')||'');
if(lm&&lm>mine+30000){location.replace(location.pathname+'?t='+Date.now()+location.hash);}
}).catch(function(){});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
setInterval(function(){if(!document.hidden)check();},120000);check();})();</script>
