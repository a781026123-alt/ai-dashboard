 #fsug a,#fhist a{color:var(--accent)}</style><body><div class=wrap><header><div><h1>看盤比對：大盤與個股</h1><p class=sub>2026-11-14｜更新 09:07｜盤中每 5 分鐘抓一次，網頁約每 10 分鐘更新</p></div><a href="index.html">回首頁</a></header><section><p class=desc>今天休市。</p></section><section><h2>查一檔，馬上跟大盤比</h2><form id=fform style="display:flex;gap:8px"><input id=fq placeholder="代號或名稱，例如 2330、華泰" autocomplete=off style="flex:1;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><button style="font:inherit;font-size:16px;border:none;border-radius:12px;padding:0 18px;color:#111827;font-weight:700;background:var(--gold-grad)">查</button></form><div id=fsug class=desc style="display:flex;flex-wrap:wrap;gap:4px 12px"></div><p class=desc style="margin-top:4px">最近查過：<span id=fhist style="display:inline-flex;flex-wrap:wrap;gap:4px 12px"></span></p><div id=fres></div></section><section><p class=desc><small>怎麼看：同步度 1 ＝完全跟大盤一樣走，0 ＝沒關係。「照平常應該」＝大盤今天漲跌 × 它平常的跟漲幅度（近 60 天，大盤用 0050 代表）。這頁幫你看懂盤勢、找要查的股票，資料約 5～10 分鐘延遲，秒級報價請看券商 App。大盤開盤後往哪走本身猜不準，所以不是買賣訊號。</small></p></section><footer>本系統僅為個人研究與模擬交易，非投資建議；過去績效不代表未來。絕不自動下單。</footer></div><script>var D={"t":[],"idx":[],"s":{}};
